<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <link rel="stylesheet" href="styles.css">\n    <title>EasyWork CRM</title>\n</head>\n<body>\n    <div id="app">\n        <h1>EasyWork CRM</h1>\n        <form id="contact-form">\n            <input type="text" id="name" placeholder="Name" required>\n            <input type="email" id="email" placeholder="Email" required>\n            <textarea id="message" placeholder="Message" required></textarea>\n            <button type="submit">Send</button>\n        </form>\n        <div id="messages"></div>\n    </div>\n<br>\n<script src="https://www.gstatic.com/firebasejs/9.1.2/firebase-app.js"></script>\n<script src="https://www.gstatic.com/firebasejs/9.1.2/firebase-database.js"></script>\n<script>\n    // Your web app's Firebase configuration\n    const firebaseConfig = {\n        apiKey: "YOUR_API_KEY",\n        authDomain: "your-app.firebaseapp.com",\n        databaseURL: "https://your-app-default-rtdb.firebaseio.com",\n        projectId: "your-app",\n        storageBucket: "your-app.appspot.com",\n        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",\n        appId: "YOUR_APP_ID"\n    };\n    // Initialize Firebase\n    const app = firebase.initializeApp(firebaseConfig);\n    const database = firebase.database();\n    const form = document.getElementById('contact-form');\n    const messagesDiv = document.getElementById('messages');\n\n    form.addEventListener('submit', function(e) {\n        e.preventDefault();\n        const name = document.getElementById('name').value;\n        const email = document.getElementById('email').value;\n        const message = document.getElementById('message').value;\n\n        // Save data to Firebase\n        database.ref('messages/').push({name, email, message}).then(() => {\n            // Display message in UI\n            const messageElement = document.createElement('div');\n            messageElement.textContent = `Name: ${name}, Email: ${email}, Message: ${message}`;\n            messagesDiv.appendChild(messageElement);\n            form.reset();\n        });\n    });\n</script>\n</body>\n</html>
