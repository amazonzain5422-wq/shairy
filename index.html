<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyWork CRM Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <!-- Include Firebase Library -->
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js"></script>
</head>
<body>
    <header>
        <h1>EasyWork CRM Dashboard</h1>
        <nav>
            <ul>
                <li><a href="#login">Login</a></li>
                <li><a href="#clients">Clients Management</a></li>
                <li><a href="#payments">Payments</a></li>
                <li><a href="#calendar">Calendar</a></li>
                <li><a href="#music">Music Player</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="login">
            <h2>Login</h2>
            <form id="loginForm">
                <label for="email">Email:</label>
                <input type="email" id="email" required>
                <label for="password">Password:</label>
                <input type="password" id="password" required>
                <button type="submit">Login</button>
            </form>
        </section>
        <section id="clients">
            <h2>Clients Management</h2>
            <div id="clientsList"></div>
            <button id="addClient">Add Client</button>
        </section>
        <section id="payments">
            <h2>Payments</h2>
            <div id="paymentsList"></div>
            <button id="addPayment">Add Payment</button>
        </section>
        <section id="calendar">
            <h2>Calendar</h2>
            <div id="calendarView"></div>
        </section>
        <section id="music">
            <h2>Music Player</h2>
            <audio controls>
                <source src="/path/to/audio/file.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 EasyWork CRM. All rights reserved.</p>
    </footer>
</body>
</html>
